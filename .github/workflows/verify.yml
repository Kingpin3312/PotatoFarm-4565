# The gate, run by a machine instead of by memory.
#
# Dozens of check suites and audit scripts existed before this file did,
# and every document said they "belong in CI". Nothing ran them.
#
# Counts are deliberately not written here in words any more. This header
# used to say "twenty-four check suites", "fifteen audit scripts" and
# "233 unit assertions", and every one of them went stale, in the file
# whose entire purpose is that nothing goes unchecked. `counts.py` reads
# this workflow now, numbers and number words alike, so a count written
# here has to be true. The whole quality argument rested on a person remembering — and
# the audit that produced this file found two suites that had been
# passing while measuring nothing at all, which is exactly what happens
# when checks are run by hand and their output is skimmed.
#
# Postgres is a service container rather than a mock. Seven suites need
# a real one, and the most important of them proves that one brokerage
# cannot read another's leads. `verify` refuses to pass without it
# rather than skipping quietly, which is the behaviour this workflow
# depends on.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  # A weekly run catches the things that rot without anybody committing:
  # a new dependency advisory, and a check whose fixtures drift with the
  # calendar. One of those has already happened here.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 02-the-project/app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: potatofarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Two roles, and the split is the tenant boundary rather than
      # tidiness. `potato_app` is subject to row-level security;
      # `postgres` owns the tables and bypasses it. If both URLs were the
      # same role, RLS would enforce nothing and `check:tenancy` would
      # pass against a database with no isolation at all.
      DATABASE_URL: postgresql://potato_app:ci@localhost:5432/potatofarm?schema=public
      DATABASE_URL_UNSCOPED: postgresql://postgres:ci@localhost:5432/potatofarm?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:ci@localhost:5432/potatofarm?schema=public
      # Throwaway values. Nothing here reaches a real service: no
      # Anthropic key, no Resend key, no Stripe key, so no test run can
      # message a customer or spend money.
      AUTH_SECRET: ci-only-not-a-real-secret
      # 32 bytes exactly. The previous value decoded to the string
      # "ci-only-32-bytes-of-base64-value!", which is 33 characters — so
      # `masterKey()` threw, `vaultReady()` caught it and returned false,
      # and **the secrets vault has never worked in CI**. Nothing noticed:
      # connecting a channel without a token is a supported path, so the
      # browser suite passed, and the preflight assertion that measures
      # this key only runs under PREFLIGHT_ENV=1, which CI does not set.
      SECRETS_KEY: Y2ktb25seS0zMi1ieXRlcy1vZi1iYXNlNjQta2V5ISE=
      CRON_SECRET: ci-only-cron-secret
      # Any value works: the check signs its own fake delivery with it,
      # so both ends agree. Leaving it unset does not fail
      # `check:whatsapp-inbound`, it *skips* it — which is how the one
      # end-to-end proof that an inbound message becomes a lead went
      # unrun for the life of the project.
      WHATSAPP_APP_SECRET: ci-only-webhook-signing-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEAT_PRICE_FILS: "9900"
      # No SUPPLIER_TRN, as in production: PotatoFarm is not
      # VAT-registered. `check:billing` sets a fictional one itself to
      # prove the registered path too.
      # Any value works, like WHATSAPP_APP_SECRET above: `check:billing`
      # signs its own fake delivery with it, so both ends agree. Unset
      # is what the first run to reach this gate hit — and unset used to
      # make the payment route answer 500 rather than refuse, because
      # `createHmac` throws on an absent key above the handler's try.
      # The route refuses now, so leaving this out no longer crashes
      # anything; it would simply mean the accept path went untested.
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_webhook_secret
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-the-project/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities in what ships (production dependencies).
      # Fails on high or critical unless accepted, with a reason and an
      # expiry, in scripts/audit-deps.mjs.
      - name: Dependency advisories
        run: npm run audit:deps

      # One of the audits drives a browser, and this job runs every one
      # of them through `run-all.sh`.
      #
      # `reveal.mjs` checks that nothing on the marketing site is left
      # invisible — every page hides itself on load and depends on an
      # IntersectionObserver to bring it back, so a change to that
      # observer's margins can strand whole sections: present in the
      # HTML, indexed by search engines, and unreadable by a person.
      # Nothing else looks for that, and it cannot be seen in a build or
      # a screenshot.
      #
      # The last commit gave this job the site server that audit needs
      # and stopped there; it still had no browser, so the audit failed
      # on the first run that ever reached it. A server and a browser are
      # two requirements, and having fixed one it was easy to believe
      # the step was done.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow was missing from this file's requirements until now, and
      # `palette.py` needs it — so the audit guaranteeing the product
      # ships one orange could never have run here.
      - name: Install audit dependencies
        run: pip install -r ../../04-audit-scripts/requirements.txt

      # `package.py` compares the deployable archive against the site it
      # was built from. The archive is gitignored, so in CI it does not
      # exist until something builds it — and a missing archive fails
      # that audit, which fails `run-all.sh`, which fails `verify`. This
      # was a second standing reason the gate was red, independent of
      # the missing site server below.
      #
      # Built rather than skipped: an audit that shrugs when its subject
      # is absent is the thing this repository keeps deleting.
      - name: Build the deployable site archive
        working-directory: .
        run: bash 02-the-project/website/package-site.sh

      - name: Prepare the database
        run: |
          # The init migration creates `potato_app` NOLOGIN, because in
          # production the role is provisioned with its own credentials
          # out of band. CI has to give it a way in after the migration
          # has created it.
          #
          # Safe here because the whole cluster is thrown away with the
          # job. **Do not run this line against a shared machine**:
          # ALTER ROLE is cluster-wide, not per-database, so setting the
          # password for one scratch database changes it for every
          # database in the cluster. Rehearsing this workflow locally
          # broke the development environment exactly that way.
          npx prisma migrate deploy
          PGPASSWORD=ci psql -h localhost -U postgres -d potatofarm \
            -c "ALTER ROLE potato_app LOGIN PASSWORD 'ci';"
          npm run db:seed

      # The marketing site, served over HTTP.
      #
      # `reveal.mjs` is one of the audits `run-all.sh` runs and it needs
      # a real server — every page on that site hides itself on load and
      # depends on an IntersectionObserver to bring it back, which cannot
      # be checked off the filesystem. It was added after this workflow
      # was last touched and nothing here started a server, so **every
      # push since has failed at this step**. That is the failure mode
      # this whole file exists to prevent, in the file itself.
      - name: Serve the website
        working-directory: 02-the-project/website
        run: |
          python3 -m http.server 8099 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8099/index.html && exit 0
            sleep 1
          done
          echo "the site server never came up"; exit 1

      # `verify` is the whole gate: types, the unit assertions, the check
      # suites and every audit script. It reports what it did NOT run
      # rather than counting a skip as a pass, so a green tick here means
      # the list was empty.
      - name: Verify
        run: npm run verify

      # The production path, not a dev server. A build that only ever
      # runs on a laptop is not evidence.
      - name: Production build
        run: npm run build

  # Split out because it needs a browser and a running server, and
  # because a browser failure should be legible as its own thing rather
  # than buried in the gate's output.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: potatofarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://potato_app:ci@localhost:5432/potatofarm?schema=public
      DATABASE_URL_UNSCOPED: postgresql://postgres:ci@localhost:5432/potatofarm?schema=public
      DATABASE_URL_DIRECT: postgresql://postgres:ci@localhost:5432/potatofarm?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret
      # 32 bytes exactly. The previous value decoded to the string
      # "ci-only-32-bytes-of-base64-value!", which is 33 characters — so
      # `masterKey()` threw, `vaultReady()` caught it and returned false,
      # and **the secrets vault has never worked in CI**. Nothing noticed:
      # connecting a channel without a token is a supported path, so the
      # browser suite passed, and the preflight assertion that measures
      # this key only runs under PREFLIGHT_ENV=1, which CI does not set.
      SECRETS_KEY: Y2ktb25seS0zMi1ieXRlcy1vZi1iYXNlNjQta2V5ISE=
      CRON_SECRET: ci-only-cron-secret
      WHATSAPP_APP_SECRET: ci-only-webhook-signing-secret
      # The same arrangement as WHATSAPP_APP_SECRET, plus one more piece.
      # `check:meta-inbound` signs its own delivery with the first and
      # answers Meta's handshake with the second, so any values work as
      # long as both ends agree.
      META_APP_SECRET: ci-only-meta-signing-secret
      META_VERIFY_TOKEN: ci-only-meta-verify-token
      # The third piece, and the reason this check lives in *this* job:
      # a Meta webhook carries only a `leadgen_id` and the lead has to
      # be fetched back over HTTP, so the suite stands a loopback Graph
      # up on 4319 and the **application** must be pointed at it. Set on
      # the job rather than the step because `npm run start` below is
      # what has to inherit it — set on the step, the check would talk
      # to its own stand-in while the server called the real Graph, and
      # the suite would report the product broken.
      #
      # `graphBase()` refuses any non-loopback value outright rather
      # than falling back to Graph, so a typo here fails loudly instead
      # of quietly sending a customer's Page token somewhere else.
      META_GRAPH_BASE: http://127.0.0.1:4319
      # The Speak button needs a transcription provider before any of
      # its route is reachable: `transcriptionConfigured()` is checked
      # ahead of the rate limit and every validation, so without these
      # the only answers the route can give are 401 and 501. The suite
      # stands a provider up on 4321 and the application must be pointed
      # at it — set on the job so `npm run start` inherits it.
      TRANSCRIBE_API_KEY: ci-only-not-a-real-key
      TRANSCRIBE_BASE_URL: http://127.0.0.1:4321
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEAT_PRICE_FILS: "9900"
      # No SUPPLIER_TRN, as in production: PotatoFarm is not
      # VAT-registered. `check:billing` sets a fictional one itself to
      # prove the registered path too.
      # This job is the one that runs `check:billing`, because that suite
      # posts a signed payment webhook at the real route and so needs the
      # application up. Same throwaway value as the verify job's.
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_webhook_secret
      # Set here as well as in the verify job, so both resolve a browser
      # the same way. It was missing, so `playwright install` below put
      # Chromium in its default cache while the scripts looked in
      # `/opt/pw-browsers` — a directory that exists on one developer
      # machine and on no runner.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02-the-project/app/package-lock.json

      - run: npm ci

      # Until this workflow existed, these scripts imported
      # Playwright from `/opt/node22/lib/node_modules/playwright/index.js`
      # — an absolute path that is correct on exactly one machine. They
      # could not run anywhere else, which is a large part of why they
      # were never in CI. It is a declared devDependency now.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare the database
        run: |
          npx prisma migrate deploy
          PGPASSWORD=ci psql -h localhost -U postgres -d potatofarm \
            -c "ALTER ROLE potato_app LOGIN PASSWORD 'ci';"
          npm run db:seed

      - name: Serve the website
        working-directory: 02-the-project/website
        run: |
          python3 -m http.server 8099 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8099/index.html && exit 0
            sleep 1
          done
          echo "the site server never came up"; exit 1

      - name: Start the application
        run: |
          npm run build
          npm run start &
          # Poll rather than sleep. A fixed sleep is either wasted time
          # or a flake, and on a cold start it is usually both.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/sign-in || true)
            [ "$code" = "200" ] && { echo "up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "the application never came up"; exit 1

      # Every screen renders and settles; each role meets the screen it
      # should and is told why when it may not; one family, one scale,
      # three weights at eight widths; and the palette as a browser
      # actually paints it.
      - name: Screens
        run: npm run browser:screens
      - name: Permissions
        run: npm run browser:roles
      - name: Typography
        run: npm run browser:type
      - name: Palette
        run: npm run browser:option1
      - name: Accessibility
        run: npm run browser:a11y

      # ------------------------------------------------------------------
      # The fifteen that nothing ran.
      #
      # At the time twenty-two browser suites existed and automation ran
      # seven. The other fifteen were complete, correct and reachable only by
      # somebody typing their name — the same shape this codebase keeps
      # producing, applied to its own quality apparatus. Two were red
      # when they were finally run: `browser:commission-plan` had been
      # asserting a money format superseded generations ago, and
      # `browser:chaos` was raising a HIGH about a favicon that only
      # fails when the site is read off the filesystem.
      #
      # **Order is deliberate.** The suites that only read run first;
      # the ones that move or create rows run last. `optimistic-board`
      # reads the board's live contents and picks the first card it
      # finds, so it goes before anything that rearranges leads — it
      # failed once inside a long mixed run and passed five times in
      # isolation, which is the profile of a state dependency rather
      # than a real fault, and the cheap fix is not to create the state.
      # ------------------------------------------------------------------
      - name: Palette, as a browser paints it
        run: npm run browser:palette
      - name: Links that resolve and go nowhere
        run: npm run browser:dead-links
      - name: The links on a viewing card
        run: npm run browser:viewing-links
      - name: The command palette, keyboard only
        run: npm run browser:palette-keys
      - name: Installable, and works with no signal
        run: npm run browser:installable
      - name: What a compliance file calls itself
        run: npm run browser:screening-heading

      # The money on the owner's screen against the ledger behind it.
      # Runs here rather than in the verify job because it reads the
      # procedure over HTTP, which needs the application up.
      - name: What the brokerage earned
        run: npm run check:revenue

      # And whether the company can take money at all. Here rather than
      # in the verify job for the same reason as the line above: the
      # invoice arithmetic is database-only, but the payment webhook is
      # posted at the real route, and the fault this caught on its first
      # CI run was in the route and not the arithmetic.
      - name: Whether the company can take money
        run: npm run check:billing

      # The inbound path for the lead source the brokerage pays for by
      # the click, and the one whose failure cannot be replayed: Meta
      # sends an id, the answers are fetched back with the Page token
      # inside a retention window, and a token that has stopped working
      # means those leads are **gone**, not queued.
      #
      # It found two faults on its first run, both invisible to every
      # check that existed. `channels.connect` generated a `secretRef`
      # for WhatsApp only, so a connected Facebook Page had its access
      # token written nowhere and every lead died at the credential
      # lookup — while the screen reported the token stored. And the
      # `SECRETS_KEY` above decoded to 33 bytes, so the vault this job
      # is supposed to exercise had never once initialised here.
      - name: An advert becomes a lead
        run: npm run check:meta-inbound

      # The brokerage's own website form. Registered last of the inbound
      # channels and the only one needing no agreement from anybody,
      # which is why its absence was the expensive one: a brokerage
      # could connect the form, the settings screen printed a webhook
      # URL, and every post to it answered 404 "Unknown portal." Needs
      # no secret, so this step cannot skip.
      - name: A website enquiry becomes a lead
        run: npm run check:website-form

      # And listings going the other way. This is the only route by
      # which a brokerage's properties reach a portal today — no
      # publishing integration exists and a feed needs no partner
      # agreement — and nothing had ever fetched it.
      - name: A portal collects the listings
        run: npm run check:listing-feed

      # One agent's diary, and nobody else's. This is the only route in
      # the product that switches row-level security off — a calendar
      # client cannot hold a session — so the tenant boundary here is a
      # where clause, and this is what proves it holds.
      - name: An agent's calendar leaks nothing
        run: npm run check:calendar-feed

      # Speech to text, and the iPhone in particular: iOS Safari records
      # mp4 where everything else records webm, and the provider infers
      # the container from the filename. Getting that wrong is the bug
      # that makes a feature work everywhere except the phone it exists
      # for, and nothing had checked it.
      - name: A voice note becomes text
        run: npm run check:voice-note

      - name: The board's optimistic move
        run: npm run browser:optimistic-board
      - name: The optimistic update, and its failure path
        run: npm run browser:optimistic

      - name: The working week
        run: npm run browser:working-hours
      - name: Opening a due diligence file
        run: npm run browser:kyc-file
      - name: Recording who the person is
        run: npm run browser:kyc-details
      - name: Adding a property
        run: npm run browser:add-property
      - name: Adding a lead the way numbers are written
        run: npm run browser:add-lead
      - name: The leads list past the first page
        run: npm run browser:lead-list
      - name: Importing leads from a spreadsheet
        run: npm run browser:import-leads
      - name: Setting a commission plan
        run: npm run browser:commission-plan

      # Before ringing an owner. The procedure behind this screen had
      # been returning the owner's properties and the date they were
      # last updated since it was written, and the component rendered
      # neither — the shape this codebase keeps producing, running out
      # rather than in.
      - name: What to say when you ring the owner
        run: npm run browser:vendor-brief
      - name: Connecting a WhatsApp number
        run: npm run browser:connect-channel

      # Last: a broad sweep over both surfaces, and the one that reads
      # the marketing site as well as the application.
      - name: Chaos
        run: npm run browser:chaos
